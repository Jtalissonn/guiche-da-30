name = "guiche-da-30"
main = "worker.js"
compatibility_date = "2026-09-01"
keep_vars = true

[triggers]
crons = ["17 8 * * *"]

# As variáveis e secrets ficam no painel da Cloudflare.
# O keep_vars acima impede que o deploy automático apague essas configurações.
# Cadastre como secrets, nunca diretamente neste arquivo:
# wrangler secret put SUPABASE_SECRET_KEY
# wrangler secret put MERCADO_PAGO_ACCESS_TOKEN
# wrangler secret put MERCADO_PAGO_WEBHOOK_SECRET
# wrangler secret put BREVO_API_KEY
# wrangler secret put BREVO_SENDER_EMAIL
# wrangler secret put CF_BROWSER_API_TOKEN
